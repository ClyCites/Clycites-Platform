name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clycites_test
          POSTGRES_USER: clycites
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clycites -d clycites_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql://clycites:test_only@localhost:5432/clycites_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      WEB_ORIGIN: http://localhost:3000
      AUTH_ACCESS_TOKEN_KEYS: '[{"kid":"ci-v1","secret":"test-only-access-token-secret-at-least-32-characters"}]'
      AUTH_DEVICE_TOKEN_PEPPER: test-only-device-token-pepper-at-least-32-characters
      AUTH_MFA_TOKEN_PEPPER: test-only-mfa-token-pepper-at-least-32-characters
      AUTH_MFA_ENCRYPTION_KEY_BASE64: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      ENQUEUE_FOUNDATION_CHECK: false
      HEDERA_PROVIDER: mock
      HEDERA_NETWORK: local
      HEDERA_TOPIC_ID: 0.0.424242
      HEDERA_SUBMISSION_ENABLED: false
      HEDERA_CONFIRMATION_ENABLED: false
      HEDERA_REFERENCE_SECRET: test-only-hedera-reference-secret-at-least-32-bytes
      HEDERA_REFERENCE_SECRET_VERSION: v1
      BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Scan tracked files for credential patterns
        run: |
          ! git grep -n -E '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,})' -- ':!pnpm-lock.yaml'

      - name: Check formatting
        run: pnpm format:check

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm --filter @clycites/database exec prisma migrate deploy

      - name: Confirm migration status
        run: pnpm --filter @clycites/database exec prisma migrate status

      - name: Validate Hedera configuration
        run: pnpm hedera:config

      - name: Seed test fixtures
        run: pnpm db:seed && pnpm db:seed

      - name: Validate controlled-pilot preflight behavior
        run: pnpm pilot:preflight -- --pilot-id=00000000-0000-4000-8000-000000006003 --allow-blocked

      - name: Validate OpenAPI document
        run: pnpm openapi:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm --filter @clycites/web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Accessibility checks
        run: pnpm test:accessibility

      - name: Offline behavior checks
        run: pnpm test:offline

      - name: Performance smoke
        run: pnpm test:performance

      - name: Security checks
        run: pnpm test:security

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Scan browser bundle for server secrets
        run: |
          ! grep -R -E "test-only-hedera-reference-secret|test-only-access-token-secret|HEDERA_OPERATOR_KEY" apps/web/.next/static
