name: clycites-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clycites}
      POSTGRES_USER: ${POSTGRES_USER:-clycites}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clycites_local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  record-store:
    image: ghcr.io/openelementslabs/record-store:${RECORD_STORE_VERSION:-0.2.1}
    environment:
      RECORD_STORE_ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-clycites}
      RECORD_STORE_ROOT_SECRET_KEY: ${S3_SECRET_KEY:-clycites_local_only}
      RECORD_STORE_CREDENTIAL_MASTER_KEY: ${RECORD_STORE_CREDENTIAL_MASTER_KEY:-clycites-local-only-credential-master-key}
      RECORD_STORE_MANAGEMENT_SYSTEM_TOKEN: ${RECORD_STORE_MANAGEMENT_SYSTEM_TOKEN:-clycites-local-only-management-system-token}
    ports:
      - '127.0.0.1:${RECORD_STORE_S3_PORT:-7600}:7600'
      - '127.0.0.1:${RECORD_STORE_API_PORT:-7601}:7601'
    volumes:
      - record_store_data:/var/lib/record-store
    healthcheck:
      test: ['CMD', 'record-store', 'status', '--endpoint', 'http://127.0.0.1:7601']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  record-store-console:
    image: ghcr.io/openelementslabs/record-store-console:${RECORD_STORE_VERSION:-0.2.1}
    depends_on:
      record-store:
        condition: service_healthy
    environment:
      RECORD_STORE_API_URL: http://record-store:7601
      RECORD_STORE_CONSOLE_SECURE_COOKIES: 'false'
    ports:
      - '127.0.0.1:${RECORD_STORE_CONSOLE_PORT:-7602}:7602'
    restart: unless-stopped

  record-store-init:
    image: ghcr.io/openelementslabs/record-store:${RECORD_STORE_VERSION:-0.2.1}
    depends_on:
      record-store:
        condition: service_healthy
    environment:
      RECORD_STORE_MANAGEMENT_TOKEN: ${RECORD_STORE_MANAGEMENT_SYSTEM_TOKEN:-clycites-local-only-management-system-token}
      S3_BUCKET: ${S3_BUCKET:-clycites-local}
    # Record Store has no implicit or idempotent bucket creation, so create only when missing.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        record-store bucket list --endpoint http://record-store:7601 | grep -qx "$$S3_BUCKET" ||
        record-store bucket create "$$S3_BUCKET" --endpoint http://record-store:7601
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  record_store_data:
